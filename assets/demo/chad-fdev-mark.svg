<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="t d">
<title id="t">CHAD FDEV animated identity mark</title><desc id="d">A dark cyberpunk red identity banner with a glowing orbit and animated CHAD FDEV lettering.</desc>
